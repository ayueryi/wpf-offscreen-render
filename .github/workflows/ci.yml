name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  render-tests:
    # WPF 只能在 Windows 上渲染；托管 Windows 运行器自带 .NET Framework 4.8，可覆盖 .NET Framework 宿主。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run render tests
        shell: pwsh
        run: ./tests/run-tests.ps1 -ArtifactsDir "${{ runner.temp }}\wpf-render-tests"

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-artifacts
          path: |
            ${{ runner.temp }}/wpf-render-tests/**/render-*/
            ${{ runner.temp }}/wpf-render-tests/*.log
          if-no-files-found: ignore
          retention-days: 7
