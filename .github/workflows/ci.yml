name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  render-tests:
    # WPF 只能在 Windows 上渲染；托管 Windows 运行器自带 .NET Framework 4.8，可覆盖 .NET Framework 宿主。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run render tests
        shell: pwsh
        run: ./tests/run-tests.ps1 -ArtifactsDir "${{ runner.temp }}\wpf-render-tests"

      - name: MCP under AllSigned execution policy
        # 模拟公司策略 / 带“来自网络”标记的安装：未签名脚本只有在启动参数带 -ExecutionPolicy Bypass 时才能运行。
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy AllSigned -Force
          $effective = Get-ExecutionPolicy
          if ($effective -ne 'AllSigned') { throw "生效的执行策略是 $effective，无法验证 AllSigned 场景" }
          dotnet run --project mcp/WpfRenderMcp.Tests -c Release -- --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: render-artifacts
          path: |
            ${{ runner.temp }}/wpf-render-tests/**/render-*/
            ${{ runner.temp }}/wpf-render-tests/*.log
          if-no-files-found: ignore
          retention-days: 7

  mcp-protocol:
    # MCP 服务器本身跨平台：在 Linux 上验证编译、启动器、工具列表与非 Windows 时的错误处理，并校验插件清单。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run MCP protocol tests
        shell: pwsh
        run: dotnet run --project mcp/WpfRenderMcp.Tests -c Release -- --root .

      - name: Check plugin manifests consistency
        shell: pwsh
        run: ./tests/validate-plugins.ps1

      - name: Validate Claude Code plugin
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.296  # 固定版本，避免校验规则变化让 CI 无故变红
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .
          claude plugin validate --strict skills
