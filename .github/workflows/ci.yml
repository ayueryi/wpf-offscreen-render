name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  render-tests:
    # WPF 只能在 Windows 上渲染；托管 Windows 运行器自带 .NET Framework 4.8，可覆盖 .NET Framework 宿主。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run render tests
        shell: pwsh
        run: ./tests/run-tests.ps1 -ArtifactsDir "${{ runner.temp }}\wpf-render-tests"

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: render-artifacts
          path: |
            ${{ runner.temp }}/wpf-render-tests/**/render-*/
            ${{ runner.temp }}/wpf-render-tests/*.log
          if-no-files-found: ignore
          retention-days: 7

  mcp-protocol:
    # MCP 服务器本身跨平台：在 Linux 上验证编译、启动器、工具列表与非 Windows 时的错误处理。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run MCP protocol tests
        shell: pwsh
        run: dotnet run --project mcp/WpfRenderMcp.Tests -c Release -- --root .
