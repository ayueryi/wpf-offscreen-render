interface:
  display_name: "Agent Render"
  short_description: "离屏渲染 WPF / Avalonia / XAML 界面为 PNG，验证布局、主题、DPI 与数据绑定（WPF .NET Framework 4.7.2 – .NET 10；Avalonia .NET 8+）"
  default_prompt: "使用 $agent-render，用 render_view 渲染我刚修改的 WPF / Avalonia 页面，检查截图、绑定错误与布局问题。"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "cli"
      value: "pwsh"
      description: "PowerShell 7+：启动 MCP 服务器并运行渲染脚本"
    - type: "cli"
      value: "dotnet"
      description: ".NET 8+ SDK：编译 MCP 服务器与临时渲染宿主（WPF / Avalonia 渲染需要 Windows）"
